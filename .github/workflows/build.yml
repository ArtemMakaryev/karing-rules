name: build

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  SING_BOX_VERSION: 1.13.0
  # sha256 of sing-box-1.13.0-linux-amd64.tar.gz from the SagerNet release
  SING_BOX_SHA256: 86db0f9df3f822ca2adccde2f7c1c9e21d64e646a77bf258274fde3be399025b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned sing-box
        run: |
          set -eu
          tarball="$RUNNER_TEMP/sing-box.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          echo "${SING_BOX_SHA256}  ${tarball}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sing-box"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/sing-box" --strip-components=1
          echo "SING_BOX=$RUNNER_TEMP/sing-box/sing-box" >> "$GITHUB_ENV"

      - name: Build srs/ and karing/
        run: scripts/build.sh

      # Outside main the committed outputs must already be current (the test below
      # rebuilds in place here, so this is where a stale commit is caught).
      - name: Committed outputs are current
        if: github.ref != 'refs/heads/main'
        run: |
          set -eu
          git add -N srs karing
          git diff --exit-code -- srs karing

      # An owner edit of source/ or groups.json in the web UI lands without outputs:
      # commit them back. The push of GITHUB_TOKEN starts no new run, so no loop;
      # nothing changed means nothing is committed.
      - name: Commit rebuilt outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          git add -A srs karing
          if git diff --cached --quiet; then
            echo "outputs are current; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild srs and karing zip (Refs ArtemMakaryev/focus-vpn#170)"
          git push

      - name: Test
        run: scripts/test.sh
